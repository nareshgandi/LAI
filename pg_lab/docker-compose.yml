services:
  pg:
    image: postgres:17
    container_name: w1s1-pg
    environment:
      POSTGRES_PASSWORD: postgres_lab_pw   # lab only
      POSTGRES_DB: bankdb
    ports:
      - "5434:5432"          # 5434 on your laptop, so it won't clash with a local PostgreSQL
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
